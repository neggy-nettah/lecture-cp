name: Validate app

on:
  push:
    branches: [main, develop-caly]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate application
        run: node scripts/check-app.js
      - name: Validate pedagogical content
        run: node scripts/check-content.js
      - name: Runtime smoke test
        run: node scripts/smoke-runtime.js
      - name: Audio engine voice loading
        run: node scripts/audio-engine-check.js
      - name: Service worker network failures
        run: node scripts/check-service-worker.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check mobile layouts, missions and profile isolation
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/caly-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            curl --silent --fail http://127.0.0.1:8765/ > /dev/null && break
            sleep 1
          done
          node scripts/browser-check.js
      - name: Check installed app offline
        run: |
          pwa_root=$(mktemp -d)
          ln -s "$PWD" "$pwa_root/lecture-cp"
          python3 -m http.server 8766 --bind 127.0.0.1 --directory "$pwa_root" > /tmp/caly-pwa.log 2>&1 &
          pwa_pid=$!
          trap 'kill "$pwa_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            curl --silent --fail http://127.0.0.1:8766/lecture-cp/ > /dev/null && break
            sleep 1
          done
          node scripts/offline-check.js
      - name: Check server errors and stalled navigation
        run: node scripts/network-browser-check.js
