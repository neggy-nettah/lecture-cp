name: Validate app

on:
  push:
    branches: [main, develop-caly]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate application
        run: node scripts/check-app.js
      - name: Validate pedagogical content
        run: node scripts/check-content.js
      - name: Runtime smoke test
        run: node scripts/smoke-runtime.js
