<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C63FF">
<title>La Fabrique des Syllabes</title>
<style>
:root{
  --bg:#fff9f1;--card:#fff;--ink:#27313b;--muted:#6e7884;
  --purple:#6c63ff;--purple2:#9a93ff;--yellow:#ffbd2e;--green:#2fbd73;
  --red:#ef476f;--blue:#3a78e8;--orange:#ff8a3d;--line:#ebe6df;
  --shadow:0 14px 34px rgba(53,50,95,.12)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:
radial-gradient(circle at 5% 8%,#fff0bd 0 125px,transparent 126px),
radial-gradient(circle at 95% 15%,#eae7ff 0 160px,transparent 161px),var(--bg);
color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}
button{border:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
.app{max-width:1040px;margin:auto;padding:14px 14px 34px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:5px 0 12px}
.brand{display:flex;gap:11px;align-items:center}.logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(140deg,var(--purple),#a49eff);display:grid;place-items:center;color:#fff;font-size:29px;box-shadow:var(--shadow)}
h1{font-size:clamp(23px,5vw,36px);line-height:1;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:4px}
.score{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 12px;font-weight:900;box-shadow:var(--shadow);white-space:nowrap;pointer-events:none;user-select:none}
.progress-card{background:#ffffffd9;border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:12px}
.progress-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:7px}
.progress{height:10px;background:#eeeaf5;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--purple),#b1abff);transition:.35s;width:0}
.layout{display:grid;grid-template-columns:220px 1fr;gap:13px}
.nav,.stage{background:#ffffffeb;border:1px solid var(--line);border-radius:23px;box-shadow:var(--shadow)}
.nav{padding:11px;height:max-content;position:sticky;top:10px}
.name{margin-bottom:10px}.name label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px 3px}.name input{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;outline:none;background:#fff}.name input:focus{border-color:var(--purple)}
.nav-btn{width:100%;display:flex;align-items:center;gap:8px;padding:11px;border-radius:14px;background:transparent;text-align:left;font-weight:850;color:var(--ink);margin:3px 0}.nav-btn.active{background:#efedff;color:#4d44d7}.nav-btn:hover{background:#f6f5ff}
.stage{padding:18px;min-height:610px;overflow:hidden}
.titlebar{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.titlebar h2{font-size:26px;margin:0 0 4px}.titlebar p{margin:0;color:var(--muted);font-size:14px}.pill{background:#fff1bf;color:#745a00;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;white-space:nowrap}
.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:16px;margin-top:13px}.center{text-align:center}
.hero-emoji{font-size:58px;line-height:1;margin:5px 0}.big{font-size:clamp(62px,14vw,112px);font-weight:1000;line-height:1;margin:7px 0}
.red{color:#df3e55}.blue{color:#376ed8}.green{color:#24965a}.purple{color:var(--purple)}
.btn{padding:12px 15px;border-radius:14px;font-weight:900;background:#efedff;color:#4c43d2;min-height:47px}.btn.primary{background:var(--purple);color:#fff;box-shadow:0 8px 18px #6c63ff33}.btn.good{background:#e4f7ed;color:#176d40}.btn.gray{background:#f2f2f2;color:#555f69}.btn.yellow{background:#fff1bd;color:#765600}
.speaker{font-size:18px}.actions{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap}
.nextbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:14px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.choice{min-height:72px;border:2px solid #e8e3f1;background:#fff;border-radius:17px;font-size:30px;font-weight:1000;color:var(--ink);transition:.15s transform,.15s border-color,.15s background}.choice:active{transform:scale(.97)}.choice.correct{background:#e7f8ee;border-color:var(--green);color:#176d40}.choice.wrong{background:#fff0f4;border-color:var(--red);color:#a21d44}
.choice.picture{font-size:42px;min-height:100px}.choice.picture small{display:block;font-size:14px;color:var(--muted);margin-top:5px}
.feedback{min-height:49px;margin-top:11px;display:flex;justify-content:center;align-items:center}.feedback .ok,.feedback .no{width:100%;padding:11px;border-radius:14px;font-weight:900}.ok{background:#e9f9f0;color:#176d40}.no{background:#fff1f4;color:#9f2145}
.sound-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.sound-tile{border:2px solid #e6e0f7;background:#faf9ff;border-radius:16px;padding:12px 6px;font-size:31px;font-weight:1000;min-height:63px}.sound-tile:active{transform:scale(.96)}
.syllable{display:inline-flex;flex-direction:column;gap:4px;min-width:108px;min-height:78px;padding:10px 15px;align-items:center;justify-content:center;border:2px solid #ded9ff;border-radius:19px;background:#faf9ff;font-size:42px;font-weight:1000;margin:6px}.syllable small{font-size:12px;color:#8a83c7;letter-spacing:1px}
.word{font-size:clamp(42px,9vw,72px);font-weight:1000;line-height:1.15;margin:13px 0}.word span:nth-child(odd){color:#dc3d53}.word span:nth-child(even){color:#3b70d7}
.word-parts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.part{padding:12px 18px;border-radius:15px;background:#f7f5ff;color:#4b43d0;font-size:27px;font-weight:1000}
.tip{margin-top:11px;padding:11px 12px;background:#f5fbff;border:1px solid #d9edf9;border-radius:14px;color:#486676;font-size:14px;line-height:1.45}
.mission{display:flex;gap:10px;align-items:center;padding:11px;border-radius:15px;background:#fffaf0;border:1px solid #f3e0ad;margin-top:12px}.mission-icon{font-size:30px}.mission b{display:block}.mission span{font-size:13px;color:#71664d}
.streak{display:inline-flex;gap:5px;align-items:center;background:#fff3d5;padding:7px 10px;border-radius:999px;font-weight:900;font-size:13px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.level{border:1px solid var(--line);background:#fff;border-radius:18px;padding:13px;text-align:center}.level .ico{font-size:34px}.level b{display:block;margin-top:5px}.level small{color:var(--muted)}
.star-pop{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);font-size:80px;pointer-events:none;animation:pop .75s both;z-index:30}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-20deg)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.22) rotate(8deg)}100%{opacity:0;transform:translate(-50%,-75%) scale(.9)}}@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}.wiggle{animation:wiggle .25s 2}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}.confetti i{position:absolute;top:-20px;font-style:normal;animation:fall 1.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(560deg);opacity:.2}}
.order-zone{display:flex;gap:8px;min-height:73px;justify-content:center;align-items:center;flex-wrap:wrap;padding:10px;border:2px dashed #d9d3ec;border-radius:17px;background:#fcfbff;margin-top:12px}.order-zone .empty{color:#9298a0;font-size:14px}.token{min-width:76px;padding:13px 15px;border-radius:15px;background:#efedff;color:#4b42c9;font-size:25px;font-weight:1000}
.emojis{font-size:58px;margin:8px 0}
.parent-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.parent-box{border:1px solid var(--line);border-radius:17px;padding:13px;background:#fff}.parent-box h3{margin:0 0 7px;font-size:16px}.parent-box p,.parent-box li{font-size:13px;color:#5f6973;line-height:1.5}
.mic-status{margin:13px auto 0;max-width:520px;padding:11px 13px;border-radius:14px;background:#f5f3ff;color:#554db5;font-weight:850;font-size:14px}.mic-status.listening{background:#fff3d5;color:#765600}.mic-status.success{background:#e9f9f0;color:#176d40}.mic-status.error{background:#fff1f4;color:#9f2145}.mic-pulse{display:inline-block;animation:micPulse .9s infinite alternate}@keyframes micPulse{to{transform:scale(1.16)}}.puzzle-wrap{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}.puzzle-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:140px;height:140px}.puzzle-piece{display:grid;place-items:center;border-radius:18px;border:2px dashed #d9d3ec;background:#f8f6ff;font-size:30px;color:#aaa}.puzzle-piece.on{border-style:solid;border-color:#f0c760;background:#fff4c8;color:#6a5000}.collection-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.collectible{padding:7px 9px;border-radius:12px;background:#f5f3ff;font-size:12px;font-weight:850;color:#554db5}.world-path{display:grid;gap:12px;margin-top:14px}.world-zone{display:grid;grid-template-columns:74px 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:20px;border:2px solid #ebe6df;background:#fff}.world-zone.unlocked{border-color:#cbc5ff;background:linear-gradient(135deg,#fff,#f8f6ff)}.world-zone.current{border-color:#6c63ff;box-shadow:0 10px 25px #6c63ff1d}.world-zone.locked{opacity:.48;filter:grayscale(.8)}.world-emoji{font-size:48px;text-align:center}.world-zone h3{margin:0 0 4px}.world-zone p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}.zone-badge{padding:7px 9px;border-radius:999px;background:#efedff;color:#4d44d7;font-size:11px;font-weight:900;white-space:nowrap}.companion-card{background:linear-gradient(135deg,#fff7d6,#fff);border:2px solid #f2d87d}.collection-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.treasure-card{border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center;background:#fff}.treasure-card.locked{filter:grayscale(1);opacity:.52}.treasure-card .treasure-emoji{font-size:46px}.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.badge-card{padding:12px;border-radius:16px;border:1px solid #ebe6df;background:#fff;text-align:center}.badge-card.locked{opacity:.42;filter:grayscale(1)}.badge-card .badge-emoji{font-size:34px}.badge-card b{display:block;margin-top:4px}.badge-card small{display:block;color:var(--muted);margin-top:3px}.mastery-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.mastery-chip{padding:9px 5px;border-radius:12px;background:#faf9ff;border:1px solid #e8e3f1;text-align:center;font-weight:900}.mastery-chip small{display:block;color:#8a83c7;font-size:10px;margin-top:3px}@media(max-width:520px){.collection-grid,.badge-grid{grid-template-columns:repeat(2,1fr)}.mastery-grid{grid-template-columns:repeat(3,1fr)}.world-zone{grid-template-columns:58px 1fr}.world-emoji{font-size:40px}.zone-badge{grid-column:2;justify-self:start}}@media(max-width:520px){.puzzle-wrap{grid-template-columns:1fr}.puzzle-grid{margin:auto}}
.bubble-arena{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:620px;margin:18px auto}.bubble{aspect-ratio:1;border-radius:50%;border:3px solid #ded9ff;background:radial-gradient(circle at 32% 28%,#fff,#efedff 58%,#ddd8ff);font-size:clamp(26px,6vw,43px);font-weight:1000;color:#4d44d7;box-shadow:inset -7px -9px 16px #6c63ff13,0 8px 18px #6c63ff18;transition:.16s transform,.16s opacity}.bubble:active{transform:scale(.91)}.bubble.pop{transform:scale(1.18);opacity:0}.memory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:600px;margin:16px auto}.memory-card{min-height:105px;border-radius:18px;border:2px solid #e6e0f7;background:#6c63ff;color:#fff;font-size:30px;font-weight:1000;display:grid;place-items:center;transition:.18s transform,.18s background}.memory-card:active{transform:scale(.96)}.memory-card.open,.memory-card.matched{background:#fff;color:#27313b}.memory-card.matched{border-color:#2fbd73;background:#e9f9f0}.beta-pill{display:inline-block;margin-left:5px;padding:2px 6px;border-radius:999px;background:#fff1bd;color:#745a00;font-size:10px;font-weight:900}@media(max-width:520px){.bubble-arena,.memory-grid{grid-template-columns:repeat(2,1fr)}}
.daily-mission{border:2px solid #ded9ff;background:linear-gradient(145deg,#fff,#f8f6ff);border-radius:22px;padding:15px;margin-top:13px}.mission-progress{display:flex;gap:6px;margin:10px 0 12px}.mission-dot{height:9px;flex:1;border-radius:999px;background:#ebe7f6}.mission-dot.done{background:#2fbd73}.mission-dot.current{background:#6c63ff}.mission-steps{display:grid;gap:7px}.mission-step{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:#fff;border:1px solid #eee9f7}.mission-step .num{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#f0edff;color:#4c43d2;font-weight:1000;flex:0 0 auto}.mission-step.done .num{background:#e4f7ed;color:#176d40}.mission-step.current{border-color:#b9b2ff;background:#faf9ff}.mission-step small{display:block;color:var(--muted);margin-top:2px}.mission-celebrate{font-size:64px;margin:5px 0}
.footer-note{text-align:center;color:#8c9299;font-size:11px;margin-top:16px}
@media(max-width:760px){
 .app{padding:8px}.layout{grid-template-columns:1fr;gap:8px}.nav{position:sticky;top:4px;z-index:40;display:flex;align-items:center;gap:6px;overflow-x:auto;padding:7px;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:#fffffff2}.nav::-webkit-scrollbar{display:none}.profilebox{min-width:178px;margin:0;flex:0 0 auto}.nav-btn{width:auto;min-width:max-content;flex:0 0 auto;margin:0;padding:10px 11px;font-size:13px}.stage{padding:13px;min-height:auto}.sound-grid{grid-template-columns:repeat(4,1fr)}.levels{grid-template-columns:1fr 1fr}.parent-grid{grid-template-columns:1fr}.top{align-items:flex-start}.top-actions{gap:5px}.score,.account-chip{font-size:12px;padding:8px 9px}.choices{gap:8px}.choice{min-height:66px}
}
@media(max-width:390px){.nav-btn{font-size:13px}.sound-grid{grid-template-columns:repeat(3,1fr)}.choice{font-size:26px}}

.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.account-chip{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 12px;font-weight:900;box-shadow:var(--shadow);white-space:nowrap;font-size:13px}.profilebox{margin-bottom:10px;padding:10px;border-radius:14px;background:#faf9ff;border:1px solid #e9e4ff}.profilebox .tiny{font-size:11px;color:var(--muted);margin-bottom:5px}.profileline{display:flex;justify-content:space-between;align-items:center;gap:6px}.sync{font-size:11px;color:var(--muted);margin-top:5px}.sync.ok{color:#228c55}.sync.err{color:#b32949}.modal{position:fixed;inset:0;background:rgba(24,24,35,.62);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.modal.hidden{display:none}.modal-card{width:min(540px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:19px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal-card h2{margin:0 0 6px}.modal-card p{color:var(--muted);font-size:14px;line-height:1.45}.form{display:grid;gap:10px;margin-top:13px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 3px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;outline:none;background:#fff}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f4f2fb;border-radius:13px;padding:4px;gap:4px}.tab{padding:10px;border-radius:10px;background:transparent;font-weight:850}.tab.active{background:#fff;box-shadow:0 3px 10px #00000012;color:#4b43ce}.auth-msg{min-height:20px;font-size:13px;margin-top:8px}.auth-msg.error{color:#b32949}.auth-msg.good{color:#228c55}.children-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.child-card{padding:14px;border:2px solid #eee9f7;border-radius:18px;background:#fff;text-align:center}.child-card .avatar{font-size:45px}.child-card b{display:block;margin:5px 0}.child-card small{color:var(--muted)}.btn.redbtn{background:#fff0f3;color:#a11f42}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <div class="logo">🪄</div>
      <div><h1>La Fabrique des Syllabes</h1><div class="sub" id="hello">Mission : devenir une super lectrice 🌟</div></div>
    </div>
    <div class="top-actions"><button class="account-chip" id="accountBtn">👤 Se connecter</button><div class="score">⭐ <span id="stars">0</span> <span id="streak"></span></div></div>
  </div>
  <div class="progress-card">
    <div class="progress-head"><span>Progression du parcours</span><span id="progressText">0 %</span></div>
    <div class="progress"><div id="progressBar"></div></div><div class="sync" id="syncStatus">Mode invité • sauvegarde locale</div>
  </div>
  <div class="layout">
    <nav class="nav" id="nav">
      <div class="profilebox"><div class="tiny">Profil enfant</div><div class="profileline"><strong id="childLabel">Invité</strong><button class="btn gray" style="min-height:34px;padding:6px 9px;font-size:12px" id="switchChildBtn">Changer</button></div></div>
      <button class="nav-btn active" data-view="home">🏠 Accueil</button>
      <button class="nav-btn" data-view="sounds">🔤 Sons</button>
      <button class="nav-btn" data-view="syllables">🧩 Syllabes</button>
      <button class="nav-btn" data-view="words">🐾 Mots</button>
      <button class="nav-btn" data-view="games">🎮 Jeux</button>
      <button class="nav-btn" data-view="world">🗺️ Mon monde</button>
      <button class="nav-btn" data-view="collection">🎁 Collection</button>
      <button class="nav-btn" data-view="parents">👨‍👩‍👧 Parents</button>
    </nav>
    <main class="stage" id="stage"></main>
  </div>
  <div class="footer-note">Les audios utilisent la voix française disponible sur l'appareil. • <span id="appVersion"></span></div>
</div>
<div id="fx"></div>
<div class="modal hidden" id="authModal"><div class="modal-card"><div id="authContent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

function speechRecognitionCtor(){return window.SpeechRecognition||window.webkitSpeechRecognition||null}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1)}
function isSafariBrowser(){return /^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(navigator.userAgent)}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function openMicrophone(status){
 if(!window.isSecureContext){
  if(status){status.className="mic-status error";status.textContent="Le micro nécessite une connexion sécurisée HTTPS."}
  return null
 }
 if(!navigator.mediaDevices?.getUserMedia){
  if(status){status.className="mic-status error";status.textContent="Ce navigateur ne donne pas accès au microphone."}
  return null
 }
 try{
  if(status){status.className="mic-status listening";status.innerHTML='<span class="mic-pulse">🎙️</span> Activation du micro…'}
  return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false})
 }catch(e){
  console.error("Micro permission error",e);
  let msg="Impossible d’accéder au microphone.";
  if(e?.name==="NotAllowedError"||e?.name==="SecurityError")msg="Micro refusé. Autorise le microphone dans les réglages Safari puis recharge la page.";
  else if(e?.name==="NotFoundError")msg="Aucun microphone détecté sur cet appareil.";
  if(status){status.className="mic-status error";status.textContent=msg}
  return null
 }
}
function createVoiceGate(stream){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return {heardVoice:()=>true,stop:()=>{}};
 const ctx=new AC(),src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();
 an.fftSize=1024;an.smoothingTimeConstant=.15;src.connect(an);
 const buf=new Uint8Array(an.fftSize);
 let baseline=.008,peak=0,voicedFrames=0,frames=0,running=true;
 const sample=()=>{
  if(!running)return;
  an.getByteTimeDomainData(buf);
  let sum=0;
  for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v}
  const rms=Math.sqrt(sum/buf.length);peak=Math.max(peak,rms);frames++;
  if(frames<10)baseline=baseline*.75+rms*.25;
  const threshold=Math.max(.018,baseline*2.2);
  if(rms>threshold)voicedFrames++;
  requestAnimationFrame(sample)
 };
 sample();
 return {
  heardVoice:()=>voicedFrames>=3&&peak>=Math.max(.022,baseline*2.1),
  stop:()=>{running=false;try{src.disconnect()}catch(e){}try{ctx.close()}catch(e){}}
 }
}
function normalizeHeard(s){
 return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"")
}
function pronunciationMatches(expected,heard){
 const e=normalizeHeard(expected),h=normalizeHeard(heard);
 if(!e||!h)return false;
 if(h===e)return true;
 const aliases={
  ma:["ma","mha"],mi:["mi","mie","mis","my"],mo:["mo","mot","mots"],mu:["mu","mue","mues"],me:["me","mais","mes","met","mets"],
  la:["la","là"],li:["li","lit","lis"],lo:["lo","lot","lots","l eau"],lu:["lu","lue","lus"],le:["le","les","lait"],
  sa:["sa","ça"],si:["si","six"],so:["so","sot","saut"],su:["su","sue","sues"],se:["se","ces","ses","c est"],
  ra:["ra"],ri:["ri","riz","rit"],ro:["ro"],ru:["ru","rue"],re:["re"],
  fa:["fa"],fi:["fi","fie"],fo:["fo","faux","faut"],fu:["fu","fut"],fe:["fe","fait","fais"],
  va:["va"],vi:["vi","vie","vis"],vo:["vo","vos","vaux"],vu:["vu","vue","vues"],ve:["ve","vais","vait"],
  pa:["pa","pas"],pi:["pi","pie"],po:["po","pot","peau"],pu:["pu","pue"],pe:["pe","paix"],
  ta:["ta","tas"],ti:["ti"],to:["to","tôt","taux"],tu:["tu","tue"],te:["te","tes"],
  na:["na"],ni:["ni","nid"],no:["no","nos"],nu:["nu","nue"],ne:["ne","nez"],
  ba:["ba","bas"],bi:["bi","bis"],bo:["bo","beau","beaux"],bu:["bu","bue"],be:["be","baie"]
 };
 return (aliases[e]||[]).some(x=>normalizeHeard(x)===h) || (h.startsWith(e)&&h.length<=e.length+2);
}

async function startPronunciationRecognition(){
 if(locked)return;
 const status=$("#micStatus");
 const stream=await openMicrophone(status);
 if(!stream)return;
 const gate=createVoiceGate(stream);
 const closeMic=()=>{try{gate.stop()}catch(e){}stream.getTracks().forEach(t=>t.stop())};
 await sleep(550);
 const Ctor=speechRecognitionCtor();
 if(!Ctor){
  if(status){
   status.className="mic-status error";
   status.textContent=isIOS()&&!isSafariBrowser()?"Le micro fonctionne, mais la reconnaissance vocale est bloquée dans ce navigateur sur iPhone. Ouvre l’app directement dans Safari.":"Le micro fonctionne, mais ce navigateur ne propose pas la reconnaissance vocale."
  }
  closeMic();
  return
 }
 window.speechSynthesis?.cancel?.();
 await sleep(250);
 const recognition=new Ctor();recognition.lang="fr-FR";recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=5;
 let finished=false,started=false;
 let watchdog=setTimeout(()=>{
  if(started&&!finished){
   try{recognition.abort()}catch(e){}closeMic();
   if(status){status.className="mic-status error";status.textContent="La reconnaissance vocale ne répond pas. Vérifie que Siri est activé puis réessaie."}
  }
 },8000);
 recognition.onstart=()=>{
  started=true;
  if(status){status.className="mic-status listening";status.innerHTML='<span class="mic-pulse">🎙️</span> J’écoute… dis seulement la syllabe'}
 };
 recognition.onresult=e=>{
  finished=true;clearTimeout(watchdog);
  const voiceDetected=gate.heardVoice();closeMic();
  const alternatives=[];for(let i=0;i<e.results[0].length;i++)alternatives.push(e.results[0][i].transcript);
  const heard=alternatives[0]||"",ok=voiceDetected&&alternatives.some(x=>pronunciationMatches(currentAnswer,x));
  if(!voiceDetected){
   miss("Je n’ai pas entendu ta voix.");
   if(status){status.className="mic-status error";status.textContent="🎙️ Aucun son vocal détecté. Parle après l’apparition de « J’écoute »."}
   return
  }
  if(ok){
   locked=true;practiceDone("Très bien prononcé !");
   if(status){status.className="mic-status success";status.textContent='✅ J’ai entendu « '+heard+' »'}
   confetti();
  }else{
   miss("Presque ! Écoute encore et réessaie.");
   if(status){status.className="mic-status error";status.textContent='J’ai entendu « '+(heard||"…")+' ». Réessaie.'}
   setTimeout(()=>speak(currentAnswer,.60),250);
  }
 };
 recognition.onerror=e=>{
  finished=true;clearTimeout(watchdog);closeMic();
  const messages={not_allowed:"Autorise le microphone pour jouer.", "not-allowed":"Autorise le microphone pour jouer.", service_not_allowed:"La reconnaissance vocale est bloquée par le navigateur.", "service-not-allowed":"La reconnaissance vocale est bloquée par le navigateur.", "no-speech":"Je n’ai rien entendu. Réessaie en parlant un peu plus fort.", audio_capture:"Je ne trouve pas de microphone.", "audio-capture":"Je ne trouve pas de microphone.", network:"La reconnaissance vocale a besoin d’Internet sur ce navigateur."};
  if(status){status.className="mic-status error";status.textContent=messages[e.error]||("Le micro n’a pas compris ("+(e.error||"erreur")+"). Réessaie.")}
 };
 recognition.onend=()=>{clearTimeout(watchdog);if(!finished){closeMic();if(status){status.className="mic-status";status.textContent="Je n’ai pas bien entendu. Tu peux réessayer."}}};
 try{recognition.start()}catch(e){clearTimeout(watchdog);closeMic();console.error("SpeechRecognition start error",e);if(status){status.className="mic-status error";status.textContent="La reconnaissance vocale n’a pas démarré. Vérifie Siri et l’autorisation micro de Safari."}}
}

function masterySummary(){
 const syllables=DATA.sets.flat(),levels=syllables.map(s=>({s,level:masteryLevel(s),m:state.mastery?.[s]||{attempts:0,correct:0}}));
 const mastered=levels.filter(x=>x.level===3).length,learning=levels.filter(x=>x.level===1||x.level===2).length,unseen=levels.filter(x=>x.level===0).length;
 const attempted=levels.filter(x=>x.m.attempts>0).sort((a,b)=>{
  const aa=a.m.correct/Math.max(1,a.m.attempts),ab=b.m.correct/Math.max(1,b.m.attempts);
  return aa-ab || b.m.attempts-a.m.attempts
 });
 return {total:syllables.length,mastered,learning,unseen,weakest:attempted.slice(0,6)}
}
function missionDayStreak(){
 const dates=[...new Set((state.missionHistory||[]).map(x=>x.date))].sort().reverse();
 if(!dates.length)return 0;
 const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
 let cursor=new Date(),today=fmt(cursor);
 if(dates[0]!==today){cursor.setDate(cursor.getDate()-1);if(dates[0]!==fmt(cursor))return 0}
 let streak=0;
 for(const d of dates){if(d!==fmt(cursor))break;streak++;cursor.setDate(cursor.getDate()-1)}
 return streak
}

async function loadChildren(){if(!sb||!session)return;const {data,error}=await sb.from("children").select("*").order("created_at",{ascending:true});if(error){console.error(error);return}children=data||[]}
function renderAccountPanel(){const c=$("#authContent");c.innerHTML=`<h2>Mon compte</h2><p>${session.user.email||""}</p><div class="children-grid">${children.map(ch=>`<button class="child-card" data-action="select-child" data-id="${ch.id}"><div class="avatar">${ch.avatar||"🦊"}</div><b>${esc(ch.nickname)}</b><small>${esc(ch.school_level||"CP")}</small></button>`).join("")}</div><div class="card"><h3 style="margin-top:0">Ajouter un enfant</h3><div class="form"><div class="field"><label>Prénom ou pseudo</label><input id="newChildName" maxlength="30"></div><div class="field"><label>Niveau</label><select id="newChildLevel"><option>CP</option><option>Grande section</option><option>CE1</option></select></div><div class="field"><label>Avatar</label><select id="newChildAvatar"><option>🦊</option><option>🐼</option><option>🦄</option><option>🐯</option><option>🐨</option><option>🐰</option></select></div><button class="btn primary" data-action="create-child">Créer le profil</button></div><div class="auth-msg" id="authMsg"></div></div><div class="actions" style="margin-top:12px"><button class="btn gray" data-action="close-modal">Fermer</button><button class="btn redbtn" data-action="logout">Se déconnecter</button></div>`}
async function createChild(){if(!sb){authMsg("Service de connexion indisponible.","error");return}const nickname=$("#newChildName").value.trim(),school_level=$("#newChildLevel").value,avatar=$("#newChildAvatar").value;if(!nickname){authMsg("Indiquez un prénom ou un pseudo.","error");return}const {data,error}=await sb.from("children").insert({parent_id:session.user.id,nickname,school_level,avatar}).select().single();if(error){authMsg(error.message,"error");return}await loadChildren();currentChild=data;localStorage.setItem("lastChildId",data.id);await loadRemoteState();renderAccountPanel();topUI()}
async function selectChild(id){const ch=children.find(x=>x.id===id);if(!ch)return;currentChild=ch;localStorage.setItem("lastChildId",id);await loadRemoteState();$("#authModal").classList.add("hidden");topUI()}

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-action]");if(!b)return;
 const a=b.dataset.action;
 if(a==="recover-home"){runtimeErrorShown=false;missionMode=false;activate("home");return}
 if(a==="go"){missionMode=false;activate(b.dataset.to);return}
 if(a==="mission-start"){missionHub();return}
 if(a==="mission-next"){startMissionStep();return}
 if(a==="mission-continue"){startMissionStep();return}
 if(a==="mission-finish"){missionComplete();return}
 if(a==="mission-back"){missionHub();return}
 if(a==="mission-review"){missionMode=false;activate("games");return}
 if(a==="mission-discover-listen"){speakMission(currentAnswer,.58);return}
 if(a==="mission-repeat-answer"){speakMission(currentAnswer,.60);return}
 if(a==="mission-bubble-repeat"){speakMission(currentAnswer,.60);return}
 if(a==="mission-discover-done"){practiceDone("Échauffement terminé !");completeMissionStep();return}
 if(a==="speak"){speak(b.dataset.text,Number(b.dataset.rate||.72));return}
 if(a==="sound-next"){state.sound=(state.sound+1)%DATA.sounds.length;if(state.sound===0)setDone("sounds");save();sounds();return}
 if(a==="sound-prev"){state.sound=(state.sound-1+DATA.sounds.length)%DATA.sounds.length;save();sounds();return}
 if(a==="sound-repeat"){practiceDone("Bien répété ! Continue comme ça.");return}
 if(a==="set-next"){state.set=(state.set+1)%DATA.sets.length;save();syllables();return}
 if(a==="set-prev"){state.set=(state.set-1+DATA.sets.length)%DATA.sets.length;save();syllables();return}
 if(a==="syllable-quiz"){startSyllableQuiz();return}
 if(a==="syllable-answer"){checkChoice(b,b.dataset.value,"syllables");return}
 if(a==="word-next"){state.word=(state.word+1)%DATA.words.length;if(state.word===0)setDone("words");save();words();return}
 if(a==="word-prev"){state.word=(state.word-1+DATA.words.length)%DATA.words.length;save();words();return}
 if(a==="word-read"){practiceDone("Bien essayé ! Les étoiles sont réservées aux réponses vérifiées.");return}
 if(a==="game-listen"){gameListen();return}
 if(a==="game-bubbles"){gameBubbles();return}
 if(a==="bubble-repeat"){speak(currentAnswer,.60);return}
 if(a==="bubble-answer"){
   if(locked)return;
   if(b.dataset.value===currentAnswer){locked=true;b.classList.add("pop");recordAttempt(true,currentAnswer);rewardVerified("Bonne bulle !","bubble:"+currentAnswer);setDone("bubbles");setTimeout(()=>speak(currentAnswer,.60),120);completeMissionStep()}
   else{recordAttempt(false,currentAnswer);b.classList.add("wiggle");miss("Essaie une autre bulle.");setTimeout(()=>b.classList.remove("wiggle"),450)}
   return
 }
 if(a==="game-memory"){gameMemory();return}
 if(a==="memory-card"){memoryFlip(b,Number(b.dataset.index));return}
 if(a==="game-family"){gameFamily();return}
 if(a==="family-answer"){
   if(locked)return;
   if(b.dataset.value===currentAnswer){locked=true;b.classList.add("correct");recordAttempt(true);rewardVerified("Intrus trouvé !","family");setDone("families");$("#feedback").innerHTML='<div class="ok">🎉 Bravo, tu as trouvé l’intrus !</div>';completeMissionStep()}
   else{b.classList.add("wrong","wiggle");recordAttempt(false);miss("Regarde bien la première lettre.");setTimeout(()=>b.classList.remove("wrong","wiggle"),600)}
   return
 }
 if(a==="game-pronunciation"){gamePronunciation();return}
 if(a==="pronunciation-listen"){speak(currentAnswer,.60);return}
 if(a==="pronunciation-record"){startPronunciationRecognition();return}
 if(a==="game-picture"){gamePicture();return}
 if(a==="game-build"){gameBuild();return}
 if(a==="game-order"){gameOrder();return}
 if(a==="repeat-answer"){speak(typeof currentAnswer==="string"?currentAnswer:currentAnswer.w,.60);return}
 if(a==="listen-answer"){checkChoice(b,b.dataset.value,"listen");return}
 if(a==="picture-answer"){checkChoice(b,b.dataset.value,"pictures");return}
 if(a==="build-token"){
   if(b.disabled)return;b.disabled=true;orderMade.push(b.dataset.value);updateBuild();return
 }
 if(a==="build-reset"){orderMade=[];document.querySelectorAll("#buildChoices .choice").forEach(x=>x.disabled=false);updateBuild();$("#feedback").innerHTML="";return}
 if(a==="order-token"){if(b.disabled)return;b.disabled=true;orderMade.push(b.dataset.value);updateOrder();return}
 if(a==="order-reset"){orderMade=[];document.querySelectorAll("#orderChoices .choice").forEach(x=>x.disabled=false);updateOrder();$("#feedback").innerHTML="";return}
 if(a==="signup"){signUp();return}
 if(a==="login"){login();return}
 if(a==="forgot"){forgot();return}
 if(a==="logout"){logout();return}
 if(a==="create-child"){createChild();return}
 if(a==="select-child"){selectChild(b.dataset.id);return}
 if(a==="close-modal"){$("#authModal").classList.add("hidden");return}
 if(a==="reset-mission"){resetDailyMission();return}
 if(a==="copy-diagnostic"){copyDiagnostic();return}
 if(a==="reset"){
   if(confirm("Remettre les étoiles et la progression à zéro ?")){state=normalizeState({name:currentChild?currentChild.nickname:(state.name||"")});currentView="home";save();render()}
 }
});
nav.addEventListener("click",e=>{const b=e.target.closest(".nav-btn");if(!b)return;missionMode=false;activate(b.dataset.view)});
$("#accountBtn").addEventListener("click",()=>openAuth());
$("#switchChildBtn").addEventListener("click",async()=>{if(!session)openAuth("login");else{await loadChildren();openAuth()}});
$("#authModal").addEventListener("click",e=>{if(e.target.id==="authModal")$("#authModal").classList.add("hidden")});
document.addEventListener("click",e=>{const tab=e.target.closest("[data-auth-tab]");if(!tab)return;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));tab.classList.add("active");renderAuthForm(tab.dataset.authTab);authMsg("")});
async function bootstrap(){
 if(sb){
  try{
   const {data:{session:s}}=await sb.auth.getSession();session=s;
   if(session){await loadChildren();const remembered=localStorage.getItem("lastChildId");if(remembered)currentChild=children.find(c=>c.id===remembered)||null;if(!currentChild&&children.length===1)currentChild=children[0];if(currentChild){localStorage.setItem("lastChildId",currentChild.id);await loadRemoteState()}}
   sb.auth.onAuthStateChange((event,newSession)=>{session=newSession;setTimeout(async()=>{if(session){await loadChildren();if(!currentChild&&children.length===1){currentChild=children[0];localStorage.setItem("lastChildId",currentChild.id);await loadRemoteState()}else{render();topUI()}}else{currentChild=null;children=[];try{state=normalizeState(JSON.parse(localStorage.getItem(guestKey())||"{}"))}catch(e){state=normalizeState({})}currentView=state.lastView||"home";render();topUI()}},0)})
  }catch(e){console.error("Supabase bootstrap error",e);session=null;currentChild=null}
 }
 if("speechSynthesis" in window){speechSynthesis.getVoices();speechSynthesis.addEventListener?.("voiceschanged",()=>speechSynthesis.getVoices())}
 render();topUI();
 if(!sb){$("#syncStatus").textContent="Mode local • service de synchronisation indisponible";$("#syncStatus").className="sync err"}
}
bootstrap();
</script>
</body>
</html>
