<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C63FF">
<title>La Fabrique des Syllabes</title>
<style>
:root{
  --bg:#fff9f1;--card:#fff;--ink:#27313b;--muted:#6e7884;
  --purple:#6c63ff;--purple2:#9a93ff;--yellow:#ffbd2e;--green:#2fbd73;
  --red:#ef476f;--blue:#3a78e8;--orange:#ff8a3d;--line:#ebe6df;
  --shadow:0 14px 34px rgba(53,50,95,.12)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:
radial-gradient(circle at 5% 8%,#fff0bd 0 125px,transparent 126px),
radial-gradient(circle at 95% 15%,#eae7ff 0 160px,transparent 161px),var(--bg);
color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}
button{border:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
.app{max-width:1040px;margin:auto;padding:14px 14px 34px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:5px 0 12px}
.brand{display:flex;gap:11px;align-items:center}.logo{width:52px;height:52px;border-radius:18px;background:linear-gradient(140deg,var(--purple),#a49eff);display:grid;place-items:center;color:#fff;font-size:29px;box-shadow:var(--shadow)}
h1{font-size:clamp(23px,5vw,36px);line-height:1;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:4px}
.score{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 12px;font-weight:900;box-shadow:var(--shadow);white-space:nowrap}
.progress-card{background:#ffffffd9;border:1px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:12px}
.progress-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:7px}
.progress{height:10px;background:#eeeaf5;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--purple),#b1abff);transition:.35s;width:0}
.layout{display:grid;grid-template-columns:220px 1fr;gap:13px}
.nav,.stage{background:#ffffffeb;border:1px solid var(--line);border-radius:23px;box-shadow:var(--shadow)}
.nav{padding:11px;height:max-content;position:sticky;top:10px}
.name{margin-bottom:10px}.name label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px 3px}.name input{width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;outline:none;background:#fff}.name input:focus{border-color:var(--purple)}
.nav-btn{width:100%;display:flex;align-items:center;gap:8px;padding:11px;border-radius:14px;background:transparent;text-align:left;font-weight:850;color:var(--ink);margin:3px 0}.nav-btn.active{background:#efedff;color:#4d44d7}.nav-btn:hover{background:#f6f5ff}
.stage{padding:18px;min-height:610px;overflow:hidden}
.titlebar{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.titlebar h2{font-size:26px;margin:0 0 4px}.titlebar p{margin:0;color:var(--muted);font-size:14px}.pill{background:#fff1bf;color:#745a00;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900;white-space:nowrap}
.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:16px;margin-top:13px}.center{text-align:center}
.hero-emoji{font-size:58px;line-height:1;margin:5px 0}.big{font-size:clamp(62px,14vw,112px);font-weight:1000;line-height:1;margin:7px 0}
.red{color:#df3e55}.blue{color:#376ed8}.green{color:#24965a}.purple{color:var(--purple)}
.btn{padding:12px 15px;border-radius:14px;font-weight:900;background:#efedff;color:#4c43d2;min-height:47px}.btn.primary{background:var(--purple);color:#fff;box-shadow:0 8px 18px #6c63ff33}.btn.good{background:#e4f7ed;color:#176d40}.btn.gray{background:#f2f2f2;color:#555f69}.btn.yellow{background:#fff1bd;color:#765600}
.speaker{font-size:18px}.actions{display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap}
.nextbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:14px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.choice{min-height:72px;border:2px solid #e8e3f1;background:#fff;border-radius:17px;font-size:30px;font-weight:1000;color:var(--ink);transition:.15s transform,.15s border-color,.15s background}.choice:active{transform:scale(.97)}.choice.correct{background:#e7f8ee;border-color:var(--green);color:#176d40}.choice.wrong{background:#fff0f4;border-color:var(--red);color:#a21d44}
.choice.picture{font-size:42px;min-height:100px}.choice.picture small{display:block;font-size:14px;color:var(--muted);margin-top:5px}
.feedback{min-height:49px;margin-top:11px;display:flex;justify-content:center;align-items:center}.feedback .ok,.feedback .no{width:100%;padding:11px;border-radius:14px;font-weight:900}.ok{background:#e9f9f0;color:#176d40}.no{background:#fff1f4;color:#9f2145}
.sound-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.sound-tile{border:2px solid #e6e0f7;background:#faf9ff;border-radius:16px;padding:12px 6px;font-size:31px;font-weight:1000;min-height:63px}.sound-tile:active{transform:scale(.96)}
.syllable{display:inline-flex;min-width:108px;min-height:78px;padding:10px 15px;align-items:center;justify-content:center;border:2px solid #ded9ff;border-radius:19px;background:#faf9ff;font-size:42px;font-weight:1000;margin:6px}
.word{font-size:clamp(42px,9vw,72px);font-weight:1000;line-height:1.15;margin:13px 0}.word span:nth-child(odd){color:#dc3d53}.word span:nth-child(even){color:#3b70d7}
.word-parts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.part{padding:12px 18px;border-radius:15px;background:#f7f5ff;color:#4b43d0;font-size:27px;font-weight:1000}
.tip{margin-top:11px;padding:11px 12px;background:#f5fbff;border:1px solid #d9edf9;border-radius:14px;color:#486676;font-size:14px;line-height:1.45}
.mission{display:flex;gap:10px;align-items:center;padding:11px;border-radius:15px;background:#fffaf0;border:1px solid #f3e0ad;margin-top:12px}.mission-icon{font-size:30px}.mission b{display:block}.mission span{font-size:13px;color:#71664d}
.streak{display:inline-flex;gap:5px;align-items:center;background:#fff3d5;padding:7px 10px;border-radius:999px;font-weight:900;font-size:13px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.level{border:1px solid var(--line);background:#fff;border-radius:18px;padding:13px;text-align:center}.level .ico{font-size:34px}.level b{display:block;margin-top:5px}.level small{color:var(--muted)}
.star-pop{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);font-size:80px;pointer-events:none;animation:pop .75s both;z-index:30}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-20deg)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.22) rotate(8deg)}100%{opacity:0;transform:translate(-50%,-75%) scale(.9)}}@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}.wiggle{animation:wiggle .25s 2}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}.confetti i{position:absolute;top:-20px;font-style:normal;animation:fall 1.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(560deg);opacity:.2}}
.order-zone{display:flex;gap:8px;min-height:73px;justify-content:center;align-items:center;flex-wrap:wrap;padding:10px;border:2px dashed #d9d3ec;border-radius:17px;background:#fcfbff;margin-top:12px}.order-zone .empty{color:#9298a0;font-size:14px}.token{min-width:76px;padding:13px 15px;border-radius:15px;background:#efedff;color:#4b42c9;font-size:25px;font-weight:1000}
.emojis{font-size:58px;margin:8px 0}
.parent-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.parent-box{border:1px solid var(--line);border-radius:17px;padding:13px;background:#fff}.parent-box h3{margin:0 0 7px;font-size:16px}.parent-box p,.parent-box li{font-size:13px;color:#5f6973;line-height:1.5}
.footer-note{text-align:center;color:#8c9299;font-size:11px;margin-top:16px}
@media(max-width:760px){
 .app{padding:10px}.layout{grid-template-columns:1fr}.nav{position:static;display:grid;grid-template-columns:1fr 1fr;gap:5px}.name{grid-column:1/-1;margin:0}.nav-btn{margin:0;padding:10px;font-size:14px}.stage{padding:14px;min-height:auto}.sound-grid{grid-template-columns:repeat(4,1fr)}.levels{grid-template-columns:1fr 1fr}.parent-grid{grid-template-columns:1fr}.top{align-items:flex-start}.score{font-size:13px}.choices{gap:8px}.choice{min-height:66px}
}
@media(max-width:390px){.nav-btn{font-size:13px}.sound-grid{grid-template-columns:repeat(3,1fr)}.choice{font-size:26px}}

.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.account-chip{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 12px;font-weight:900;box-shadow:var(--shadow);white-space:nowrap;font-size:13px}.profilebox{margin-bottom:10px;padding:10px;border-radius:14px;background:#faf9ff;border:1px solid #e9e4ff}.profilebox .tiny{font-size:11px;color:var(--muted);margin-bottom:5px}.profileline{display:flex;justify-content:space-between;align-items:center;gap:6px}.sync{font-size:11px;color:var(--muted);margin-top:5px}.sync.ok{color:#228c55}.sync.err{color:#b32949}.modal{position:fixed;inset:0;background:rgba(24,24,35,.62);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.modal.hidden{display:none}.modal-card{width:min(540px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:19px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal-card h2{margin:0 0 6px}.modal-card p{color:var(--muted);font-size:14px;line-height:1.45}.form{display:grid;gap:10px;margin-top:13px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 3px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;outline:none;background:#fff}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f4f2fb;border-radius:13px;padding:4px;gap:4px}.tab{padding:10px;border-radius:10px;background:transparent;font-weight:850}.tab.active{background:#fff;box-shadow:0 3px 10px #00000012;color:#4b43ce}.auth-msg{min-height:20px;font-size:13px;margin-top:8px}.auth-msg.error{color:#b32949}.auth-msg.good{color:#228c55}.children-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.child-card{padding:14px;border:2px solid #eee9f7;border-radius:18px;background:#fff;text-align:center}.child-card .avatar{font-size:45px}.child-card b{display:block;margin:5px 0}.child-card small{color:var(--muted)}.btn.redbtn{background:#fff0f3;color:#a11f42}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <div class="logo">🪄</div>
      <div><h1>La Fabrique des Syllabes</h1><div class="sub" id="hello">Mission : devenir une super lectrice 🌟</div></div>
    </div>
    <div class="top-actions"><button class="account-chip" id="accountBtn">👤 Se connecter</button><div class="score">⭐ <span id="stars">0</span> <span id="streak"></span></div></div>
  </div>
  <div class="progress-card">
    <div class="progress-head"><span>Progression du parcours</span><span id="progressText">0 %</span></div>
    <div class="progress"><div id="progressBar"></div></div><div class="sync" id="syncStatus">Mode invité • sauvegarde locale</div>
  </div>
  <div class="layout">
    <nav class="nav" id="nav">
      <div class="profilebox"><div class="tiny">Profil enfant</div><div class="profileline"><strong id="childLabel">Invité</strong><button class="btn gray" style="min-height:34px;padding:6px 9px;font-size:12px" id="switchChildBtn">Changer</button></div></div>
      <button class="nav-btn active" data-view="home">🏠 Accueil</button>
      <button class="nav-btn" data-view="sounds">🔤 Sons</button>
      <button class="nav-btn" data-view="syllables">🧩 Syllabes</button>
      <button class="nav-btn" data-view="words">🐾 Mots</button>
      <button class="nav-btn" data-view="games">🎮 Jeux</button>
      <button class="nav-btn" data-view="parents">👨‍👩‍👧 Parents</button>
    </nav>
    <main class="stage" id="stage"></main>
  </div>
  <div class="footer-note">Les audios utilisent la voix française disponible sur l'appareil.</div>
</div>
<div id="fx"></div>
<div class="modal hidden" id="authModal"><div class="modal-card"><div id="authContent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const DATA={
 sounds:[
  {g:"a",say:"a",hint:"comme dans ami",emoji:"🍍"},
  {g:"i",say:"i",hint:"comme dans image",emoji:"🖼️"},
  {g:"o",say:"o",hint:"comme dans olive",emoji:"🫒"},
  {g:"u",say:"u",hint:"comme dans lune",emoji:"🌙"},
  {g:"é",say:"é",hint:"comme dans école",emoji:"🏫"},
  {g:"m",say:"mmmm",hint:"le son mmmm",emoji:"🐑"},
  {g:"l",say:"llll",hint:"le son llll",emoji:"🌙"},
  {g:"s",say:"ssss",hint:"le son ssss",emoji:"🐍"},
  {g:"r",say:"rrrr",hint:"le son rrrr",emoji:"🏎️"},
  {g:"f",say:"ffff",hint:"le son ffff",emoji:"🍃"},
  {g:"v",say:"vvvv",hint:"le son vvvv",emoji:"🐝"},
  {g:"p",say:"pe",hint:"le son p",emoji:"🐧"},
  {g:"t",say:"te",hint:"le son t",emoji:"🐯"},
  {g:"n",say:"nnnn",hint:"le son nnnn",emoji:"👃"},
  {g:"b",say:"be",hint:"le son b",emoji:"🎈"}
 ],
 sets:[
  ["ma","mi","mo","mu","mé"],["la","li","lo","lu","lé"],["sa","si","so","su","sé"],
  ["ra","ri","ro","ru","ré"],["fa","fi","fo","fu","fé"],["va","vi","vo","vu","vé"],
  ["pa","pi","po","pu","pé"],["ta","ti","to","tu","té"],["na","ni","no","nu","né"],["ba","bi","bo","bu","bé"]
 ],
 words:[
  {w:"maman",parts:["ma","man"],emoji:"👩"},{w:"papa",parts:["pa","pa"],emoji:"👨"},
  {w:"moto",parts:["mo","to"],emoji:"🏍️"},{w:"lune",parts:["lu","ne"],emoji:"🌙"},
  {w:"tomate",parts:["to","ma","te"],emoji:"🍅"},{w:"banane",parts:["ba","na","ne"],emoji:"🍌"},
  {w:"pirate",parts:["pi","ra","te"],emoji:"🏴‍☠️"},{w:"valise",parts:["va","li","se"],emoji:"🧳"},
  {w:"domino",parts:["do","mi","no"],emoji:"🁢"},{w:"salami",parts:["sa","la","mi"],emoji:"🥓"},
  {w:"cabane",parts:["ca","ba","ne"],emoji:"🛖"},{w:"minute",parts:["mi","nu","te"],emoji:"⏱️"}
 ],
 sentences:[
   ["Papa","a","une","moto."],["Maman","a","une","valise."],["Lili","a","une","banane."],["Nina","a","une","jolie","robe."]
 ]
};

const SUPABASE_URL="https://dqxwwxzpvxroiueqursc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_uyKC1ioxc2-1MgOscqyDlQ_0AMqbOli";
const APP_URL="https://neggy-nettah.github.io/lecture-cp/";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const DEFAULT_STATE={stars:0,streak:0,name:"",done:{},sound:0,set:0,word:0,gameWins:0,lastView:"home"};
let session=null,currentChild=null,children=[],saveTimer=null;
function normalizeState(raw){return {...DEFAULT_STATE,...(raw||{}),done:(raw&&raw.done)||{}}}
function guestKey(){return "fabriqueSyllabesGuestV4"}
function childKey(id){return "fabriqueSyllabesChild_"+id}
let state;try{state=normalizeState(JSON.parse(localStorage.getItem(guestKey())||"{}"))}catch(e){state=normalizeState({})}
let currentView=state.lastView||"home",locked=false,currentAnswer=null,orderTarget=[],orderMade=[];
const $=s=>document.querySelector(s);
const stage=$("#stage"),nav=$("#nav"),fx=$("#fx");
function saveLocal(){localStorage.setItem(currentChild?childKey(currentChild.id):guestKey(),JSON.stringify(state))}
async function saveRemoteNow(){
 saveLocal();topUI();if(!session||!currentChild)return;
 $("#syncStatus").textContent="☁️ Synchronisation…";$("#syncStatus").className="sync";
 const {error}=await sb.from("progress").upsert({child_id:currentChild.id,lesson_id:"app_state",stars:state.stars||0,completed:Object.keys(state.done||{}).length>=6,attempts:0,correct_answers:0,lesson_state:state},{onConflict:"child_id,lesson_id"});
 if(error){console.error(error);$("#syncStatus").textContent="⚠️ Sauvegardé localement • synchro impossible";$("#syncStatus").className="sync err"}else{$("#syncStatus").textContent="☁️ Progression synchronisée";$("#syncStatus").className="sync ok"}
}
function save(){saveLocal();topUI();clearTimeout(saveTimer);saveTimer=setTimeout(saveRemoteNow,450)}
async function loadRemoteState(){
 if(!session||!currentChild)return;$("#syncStatus").textContent="☁️ Chargement…";
 const {data,error}=await sb.from("progress").select("lesson_state").eq("child_id",currentChild.id).eq("lesson_id","app_state").maybeSingle();
 if(error)console.error(error);
 if(data&&data.lesson_state)state=normalizeState(data.lesson_state);else{try{const cached=JSON.parse(localStorage.getItem(childKey(currentChild.id))||"null");state=normalizeState(cached||{name:currentChild.nickname})}catch(e){state=normalizeState({name:currentChild.nickname})}await saveRemoteNow()}
 state.name=currentChild.nickname;currentView=state.lastView||"home";saveLocal();render();topUI();
}
function topUI(){
 $("#stars").textContent=state.stars||0;$("#streak").textContent=(state.streak||0)>=2?`🔥${state.streak}`:"";
 const displayName=currentChild?currentChild.nickname:(state.name||"");
 $("#hello").textContent=displayName?`Allez ${displayName} ! Mission lecture 🌟`:"Mission : devenir une super lectrice 🌟";
 $("#childLabel").textContent=currentChild?`${currentChild.avatar||"🦊"} ${currentChild.nickname}`:"Invité";
 $("#accountBtn").textContent=session?"👤 Mon compte":"👤 Se connecter";
 const keys=["sounds","syllables","words","listen","pictures","order"];const done=keys.filter(k=>state.done[k]).length;const pct=Math.round(done/keys.length*100);$("#progressBar").style.width=pct+"%";$("#progressText").textContent=pct+" %";
 if(!session){$("#syncStatus").textContent="Mode invité • sauvegarde locale";$("#syncStatus").className="sync"}else if(!currentChild){$("#syncStatus").textContent="Compte connecté • choisissez un profil enfant";$("#syncStatus").className="sync"}
}
function setDone(k){state.done[k]=true;save()}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function colorSyl(s){return `<span class="red">${esc(s[0]||"")}</span><span class="blue">${esc(s.slice(1))}</span>`}
function wordHTML(parts){return parts.map((p,i)=>`<span>${esc(p)}</span>`).join("·")}

function voice(){
 const vs=window.speechSynthesis?.getVoices?.()||[];
 return vs.find(v=>/^fr[-_]/i.test(v.lang)&&/France|French|fr-FR/i.test(v.lang+" "+v.name))||vs.find(v=>/^fr/i.test(v.lang))||null
}
function speak(text,rate=.72,cb){
 if(!("speechSynthesis" in window)){toast("🔈 Audio non disponible sur ce navigateur.");return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang="fr-FR";u.rate=rate;u.pitch=1.06;u.volume=1;
 const v=voice();if(v)u.voice=v;if(cb)u.onend=cb;speechSynthesis.speak(u)
}
function tone(kind="ok"){
 try{
  const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();
  const osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);
  osc.type="sine";osc.frequency.value=kind==="ok"?660:220;gain.gain.setValueAtTime(.001,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.22);
  osc.start();osc.stop(ctx.currentTime+.24)
 }catch(e){}
}
function starFx(){
 const d=document.createElement("div");d.className="star-pop";d.textContent="⭐";fx.appendChild(d);setTimeout(()=>d.remove(),780)
}
function confetti(){
 const box=document.createElement("div");box.className="confetti";
 const bits=["⭐","✨","🎉","💜","🟡","🔵"];
 for(let i=0;i<20;i++){const x=document.createElement("i");x.textContent=pick(bits);x.style.left=Math.random()*100+"%";x.style.animationDelay=Math.random()*.35+"s";x.style.fontSize=(14+Math.random()*17)+"px";box.appendChild(x)}
 fx.appendChild(box);setTimeout(()=>box.remove(),1900)
}
function reward(msg="Bravo !"){
 state.stars++;state.streak++;save();tone("ok");starFx();toast("🌟 "+msg,"ok")
}
function miss(msg="Écoute encore une fois."){
 state.streak=0;save();tone("no");toast("💪 "+msg,"no")
}
function toast(msg,type="ok"){
 const f=$("#feedback");if(f)f.innerHTML=`<div class="${type}">${msg}</div>`
}
function title(t,p,pill){return `<div class="titlebar"><div><h2>${t}</h2><p>${p}</p></div>${pill?`<span class="pill">${pill}</span>`:""}</div>`}
function mission(ico,b,txt){return `<div class="mission"><div class="mission-icon">${ico}</div><div><b>${b}</b><span>${txt}</span></div></div>`}
function activate(v){currentView=v;state.lastView=v;save();document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.view===v));render()}
function nextRandom(arr,answer,n=4){let a=shuffle(arr.filter(x=>x!==answer)).slice(0,n-1);return shuffle([answer,...a])}

function checkChoice(btn,value,kind){
 if(locked)return;
 if(value===currentAnswer){
   locked=true;btn.classList.add("correct");reward("Bonne réponse !");
   if(kind==="listen")setDone("listen");if(kind==="pictures")setDone("pictures");if(kind==="syllables")setDone("syllables");
   speak(value,.64);if(state.streak>0&&state.streak%5===0)confetti()
 }else{
   btn.classList.add("wrong","wiggle");miss();speak(currentAnswer,.60);setTimeout(()=>btn.classList.remove("wrong","wiggle"),650)
 }
}


function authMsg(text,type=""){const el=$("#authMsg");if(el){el.textContent=text;el.className="auth-msg "+type}}
function renderAuthForm(mode){const f=$("#authForm");if(!f)return;if(mode==="signup")f.innerHTML=`<div class="form"><div class="field"><label>Votre prénom</label><input id="signupName"></div><div class="field"><label>Email</label><input id="signupEmail" type="email"></div><div class="field"><label>Mot de passe (8 caractères minimum)</label><input id="signupPassword" type="password"></div><button class="btn primary" data-action="signup">Créer mon compte</button></div>`;else f.innerHTML=`<div class="form"><div class="field"><label>Email</label><input id="loginEmail" type="email"></div><div class="field"><label>Mot de passe</label><input id="loginPassword" type="password"></div><button class="btn primary" data-action="login">Se connecter</button><button class="btn gray" data-action="forgot">Mot de passe oublié</button></div>`}
function openAuth(mode="login"){const modal=$("#authModal"),content=$("#authContent");modal.classList.remove("hidden");if(session){renderAccountPanel();return}content.innerHTML=`<h2>Compte parent</h2><p>Connectez-vous pour synchroniser la progression entre plusieurs appareils.</p><div class="tabs"><button class="tab ${mode==="login"?"active":""}" data-auth-tab="login">Connexion</button><button class="tab ${mode==="signup"?"active":""}" data-auth-tab="signup">Créer un compte</button></div><div id="authForm"></div><div class="auth-msg" id="authMsg"></div><div class="actions" style="margin-top:10px"><button class="btn gray" data-action="close-modal">Continuer en invité</button></div>`;renderAuthForm(mode)}
async function signUp(){const email=$("#signupEmail").value.trim(),password=$("#signupPassword").value,name=$("#signupName").value.trim();if(!email||password.length<8){authMsg("Email valide et mot de passe de 8 caractères minimum.","error");return}authMsg("Création du compte…");const {error}=await sb.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:APP_URL}});authMsg(error?error.message:"Compte créé ✅ Vérifiez votre boîte mail et cliquez sur le lien de confirmation.",error?"error":"good")}
async function login(){const email=$("#loginEmail").value.trim(),password=$("#loginPassword").value;authMsg("Connexion…");const {error}=await sb.auth.signInWithPassword({email,password});if(error){authMsg(error.message,"error");return}$("#authModal").classList.add("hidden")}
async function forgot(){const email=$("#loginEmail").value.trim();if(!email){authMsg("Entrez d'abord votre email.","error");return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:APP_URL});authMsg(error?error.message:"Email de réinitialisation envoyé ✅",error?"error":"good")}
async function logout(){await sb.auth.signOut();session=null;currentChild=null;children=[];try{state=normalizeState(JSON.parse(localStorage.getItem(guestKey())||"{}"))}catch(e){state=normalizeState({})}currentView=state.lastView||"home";$("#authModal").classList.add("hidden");render();topUI()}
async function loadChildren(){if(!session)return;const {data,error}=await sb.from("children").select("*").order("created_at",{ascending:true});if(error){console.error(error);return}children=data||[]}
function renderAccountPanel(){const c=$("#authContent");c.innerHTML=`<h2>Mon compte</h2><p>${session.user.email||""}</p><div class="children-grid">${children.map(ch=>`<button class="child-card" data-action="select-child" data-id="${ch.id}"><div class="avatar">${ch.avatar||"🦊"}</div><b>${esc(ch.nickname)}</b><small>${esc(ch.school_level||"CP")}</small></button>`).join("")}</div><div class="card"><h3 style="margin-top:0">Ajouter un enfant</h3><div class="form"><div class="field"><label>Prénom ou pseudo</label><input id="newChildName" maxlength="30"></div><div class="field"><label>Niveau</label><select id="newChildLevel"><option>CP</option><option>Grande section</option><option>CE1</option></select></div><div class="field"><label>Avatar</label><select id="newChildAvatar"><option>🦊</option><option>🐼</option><option>🦄</option><option>🐯</option><option>🐨</option><option>🐰</option></select></div><button class="btn primary" data-action="create-child">Créer le profil</button></div><div class="auth-msg" id="authMsg"></div></div><div class="actions" style="margin-top:12px"><button class="btn gray" data-action="close-modal">Fermer</button><button class="btn redbtn" data-action="logout">Se déconnecter</button></div>`}
async function createChild(){const nickname=$("#newChildName").value.trim(),school_level=$("#newChildLevel").value,avatar=$("#newChildAvatar").value;if(!nickname){authMsg("Indiquez un prénom ou un pseudo.","error");return}const {data,error}=await sb.from("children").insert({parent_id:session.user.id,nickname,school_level,avatar}).select().single();if(error){authMsg(error.message,"error");return}await loadChildren();currentChild=data;localStorage.setItem("lastChildId",data.id);await loadRemoteState();renderAccountPanel();topUI()}
async function selectChild(id){const ch=children.find(x=>x.id===id);if(!ch)return;currentChild=ch;localStorage.setItem("lastChildId",id);await loadRemoteState();$("#authModal").classList.add("hidden");topUI()}

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-action]");if(!b)return;
 const a=b.dataset.action;
 if(a==="go"){activate(b.dataset.to);return}
 if(a==="speak"){speak(b.dataset.text,Number(b.dataset.rate||.72));return}
 if(a==="sound-next"){state.sound=(state.sound+1)%DATA.sounds.length;if(state.sound===0)setDone("sounds");save();sounds();return}
 if(a==="sound-prev"){state.sound=(state.sound-1+DATA.sounds.length)%DATA.sounds.length;save();sounds();return}
 if(a==="sound-repeat"){reward("Super prononciation !");setDone("sounds");return}
 if(a==="set-next"){state.set=(state.set+1)%DATA.sets.length;save();syllables();return}
 if(a==="set-prev"){state.set=(state.set-1+DATA.sets.length)%DATA.sets.length;save();syllables();return}
 if(a==="syllable-quiz"){startSyllableQuiz();return}
 if(a==="syllable-answer"){checkChoice(b,b.dataset.value,"syllables");return}
 if(a==="word-next"){state.word=(state.word+1)%DATA.words.length;if(state.word===0)setDone("words");save();words();return}
 if(a==="word-prev"){state.word=(state.word-1+DATA.words.length)%DATA.words.length;save();words();return}
 if(a==="word-read"){reward("Mot lu !");setDone("words");return}
 if(a==="game-listen"){gameListen();return}
 if(a==="game-picture"){gamePicture();return}
 if(a==="game-build"){gameBuild();return}
 if(a==="game-order"){gameOrder();return}
 if(a==="repeat-answer"){speak(typeof currentAnswer==="string"?currentAnswer:currentAnswer.w,.60);return}
 if(a==="listen-answer"){checkChoice(b,b.dataset.value,"listen");return}
 if(a==="picture-answer"){checkChoice(b,b.dataset.value,"pictures");return}
 if(a==="build-token"){
   if(b.disabled)return;b.disabled=true;orderMade.push(b.dataset.value);updateBuild();return
 }
 if(a==="build-reset"){orderMade=[];document.querySelectorAll("#buildChoices .choice").forEach(x=>x.disabled=false);updateBuild();$("#feedback").innerHTML="";return}
 if(a==="order-token"){if(b.disabled)return;b.disabled=true;orderMade.push(b.dataset.value);updateOrder();return}
 if(a==="order-reset"){orderMade=[];document.querySelectorAll("#orderChoices .choice").forEach(x=>x.disabled=false);updateOrder();$("#feedback").innerHTML="";return}
 if(a==="signup"){signUp();return}
 if(a==="login"){login();return}
 if(a==="forgot"){forgot();return}
 if(a==="logout"){logout();return}
 if(a==="create-child"){createChild();return}
 if(a==="select-child"){selectChild(b.dataset.id);return}
 if(a==="close-modal"){$("#authModal").classList.add("hidden");return}
 if(a==="reset"){
   if(confirm("Remettre les étoiles et la progression à zéro ?")){state=normalizeState({name:currentChild?currentChild.nickname:(state.name||"")});currentView="home";save();render()}
 }
});

$("#switchChildBtn").addEventListener("click",async()=>{if(!session)openAuth("login");else{await loadChildren();openAuth()}});
$("#authModal").addEventListener("click",e=>{if(e.target.id==="authModal")$("#authModal").classList.add("hidden")});
document.addEventListener("click",e=>{const tab=e.target.closest("[data-auth-tab]");if(!tab)return;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));tab.classList.add("active");renderAuthForm(tab.dataset.authTab);authMsg("")});
async function bootstrap(){const {data:{session:s}}=await sb.auth.getSession();session=s;if(session){await loadChildren();const remembered=localStorage.getItem("lastChildId");if(remembered)currentChild=children.find(c=>c.id===remembered)||null;if(!currentChild&&children.length===1)currentChild=children[0];if(currentChild){localStorage.setItem("lastChildId",currentChild.id);await loadRemoteState()}}sb.auth.onAuthStateChange((event,newSession)=>{session=newSession;setTimeout(async()=>{if(session){await loadChildren();if(!currentChild&&children.length===1){currentChild=children[0];localStorage.setItem("lastChildId",currentChild.id);await loadRemoteState()}else{render();topUI()}}else{currentChild=null;children=[];try{state=normalizeState(JSON.parse(localStorage.getItem(guestKey())||"{}"))}catch(e){state=normalizeState({})}currentView=state.lastView||"home";render();topUI()}},0)});if("speechSynthesis" in window){speechSynthesis.getVoices();speechSynthesis.addEventListener?.("voiceschanged",()=>speechSynthesis.getVoices())}render();topUI()}
bootstrap();
</script>
</body>
</html>
